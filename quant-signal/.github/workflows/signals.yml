name: 시그널 생성

on:
  schedule:
    # 미국 장 마감 후. 22:30 UTC = 서머타임 18:30 ET / 표준시 17:30 ET.
    # 화~토 = 미국 월~금 장 마감 직후.
    - cron: "30 22 * * 2-6"
  workflow_dispatch:
    inputs:
      limit:
        description: "유니버스 상한 (0=전체)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements-dev.txt

      - name: 테스트
        run: python -m pytest tests/ -q

      - name: 시그널 생성
        run: |
          python -m engine.cli \
            --source yahoo \
            --limit "${{ github.event.inputs.limit || 0 }}" \
            --out web/data

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "시그널 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
