<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>블로그 사진 올리기</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6feb">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #5b6470; --line: #e3e6ea;
    --accent: #1f6feb; --accent-text: #fff; --danger: #c62828; --ok: #1a7f37; --soft: #eef3fe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --text: #e8eaed; --muted: #9aa3ad; --line: #2a2f38;
      --accent: #4c8dff; --accent-text: #0b0d10; --danger: #ef5350; --ok: #3fb950; --soft: #1b2433;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 8px; color: var(--muted); }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .field { display: block; font-weight: 600; margin-bottom: 14px; }
  .opt { color: var(--muted); font-weight: 400; font-size: 14px; }
  .field textarea { resize: vertical; line-height: 1.5; }
  .field input, .field textarea {
    display: block; width: 100%; margin-top: 6px; font: inherit; font-size: 17px; font-weight: 400;
    padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text);
  }
  .hint { color: var(--muted); font-size: 14px; font-weight: 400; margin: 6px 0 0; }
  code { font-size: 13px; word-break: break-all; }
  a { color: var(--accent); }
  button {
    font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); padding: 12px 16px;
  }
  .icon-btn { font-size: 22px; line-height: 1; padding: 6px 10px; border: 0; background: none; }
  .primary { width: 100%; background: var(--accent); color: var(--accent-text); border: 0; font-weight: 700; font-size: 17px; padding: 16px; }
  .primary:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .pick {
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 26px 12px;
    border: 2px dashed var(--accent); border-radius: 14px; color: var(--accent); font-weight: 700; text-align: center; cursor: pointer;
  }
  .pick small { color: var(--muted); font-weight: 400; }
  .sr { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .summary { color: var(--muted); font-size: 14px; margin: 12px 0 0; }
  .grid { list-style: none; padding: 0; margin: 12px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .grid li { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--soft); }
  .grid img, .grid video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid .rm {
    position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; padding: 0; border-radius: 50%;
    background: rgba(0,0,0,.6); color: #fff; border: 0; font-size: 18px; line-height: 30px;
  }
  .grid .tag { position: absolute; left: 4px; bottom: 4px; font-size: 11px; background: rgba(0,0,0,.6); color: #fff; border-radius: 6px; padding: 1px 6px; }
  .grid li.big { outline: 3px solid var(--danger); outline-offset: -3px; }
  .grid li.up::after { content: ""; position: absolute; inset: 0; background: rgba(31,111,235,.35); }
  .grid li.done::after {
    content: "✓"; position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(26,127,55,.5); color: #fff; font-size: 32px; font-weight: 700;
  }
  .bar { height: 10px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-top: 14px; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .progress-text { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
  .msg { padding: 12px; border-radius: 10px; margin-top: 12px; font-size: 15px; border: 1px solid var(--line); }
  .msg.ok { border-color: var(--ok); color: var(--ok); }
  .msg.err { border-color: var(--danger); color: var(--danger); }
  .msg a { font-weight: 700; }
  .history { list-style: none; padding: 0; margin: 0; }
  .history li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
  .history li:first-child { border-top: 0; }
  .history .meta { color: var(--muted); white-space: nowrap; }
  details summary { cursor: pointer; color: var(--muted); margin-bottom: 12px; }
  ol.steps { padding-left: 20px; margin: 8px 0 0; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>블로그 사진 올리기</h1>
  <button id="openSettings" class="icon-btn" type="button" aria-label="설정">⚙</button>
</header>

<main>
  <section id="settings" class="card" hidden>
    <h2>설정</h2>
    <label class="field">GitHub 토큰
      <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_로 시작하는 토큰">
      <p class="hint" id="tokenState"></p>
    </label>
    <p class="hint">
      토큰이 없다면 <a id="newTokenLink" target="_blank" rel="noopener">여기서 새 토큰 만들기</a>
    </p>
    <ol class="steps">
      <li>Repository access → <b>Only select repositories</b> → <b>do-better-workspace</b></li>
      <li>Permissions → <b>Contents</b> → <b>Read and write</b></li>
      <li><b>Generate token</b> 후 복사해서 위 칸에 붙여넣기</li>
    </ol>
    <details style="margin-top:14px">
      <summary>고급 설정</summary>
      <label class="field">저장소 <input id="repo" autocapitalize="off" spellcheck="false"></label>
      <label class="field">브랜치 <input id="branch" autocapitalize="off" spellcheck="false"></label>
      <label class="field">올릴 폴더 <input id="dir" autocapitalize="off" spellcheck="false"></label>
    </details>
    <div class="row" style="margin-top:8px">
      <button id="clearToken" type="button">토큰 지우기</button>
      <button id="saveSettings" type="button" class="primary">저장하고 연결 확인</button>
    </div>
    <div id="settingsMsg" class="msg" hidden></div>
  </section>

  <section id="uploader" hidden>
    <div class="card">
      <label class="field">포스팅 이름
        <input id="posting" list="recentNames" placeholder="예: 저스트짐" autocomplete="off">
        <p class="hint">저장 위치: <code id="folderPreview"></code></p>
      </label>
      <datalist id="recentNames"></datalist>

      <label class="field">가이드 URL <span class="opt">(선택)</span>
        <input id="guideUrl" type="url" inputmode="url" placeholder="https://..." autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <label class="field">가이드 내용 붙여넣기 <span class="opt">(선택)</span>
        <textarea id="guideText" rows="4" placeholder="리뷰노트처럼 로그인해야 보이는 가이드는 내용을 복사해서 여기에 붙여넣어 주세요"></textarea>
      </label>
      <label class="field">체험 메모 <span class="opt">(선택)</span>
        <textarea id="memo" rows="3" placeholder="예: 하체 운동 때 안 되던 자세를 짚어줌, 샤워실이 깨끗했음"></textarea>
        <p class="hint">직접 느낀 점을 적어 주면 블로그 원고가 훨씬 사람답게 나와요.</p>
      </label>

      <label class="pick" for="picker">
        <span>＋ 사진·영상 선택</span>
        <small>여러 장 한꺼번에 고를 수 있어요</small>
      </label>
      <input id="picker" class="sr" type="file" accept="image/*,video/*" multiple>

      <p id="summary" class="summary"></p>
      <ul id="grid" class="grid"></ul>

      <button id="uploadBtn" class="primary" type="button" disabled>올리기</button>
      <div id="progress" hidden>
        <div class="bar"><span id="bar"></span></div>
        <p id="progressText" class="progress-text"></p>
      </div>
      <div id="result" class="msg" hidden></div>
    </div>

    <div class="card">
      <h2>최근 올린 기록</h2>
      <ul id="history" class="history"></ul>
    </div>
  </section>
</main>

<script type="module">
  import { uploadFiles, checkAccess, cleanSegment, folderFor, MAX_BYTES } from './uploader.js';

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('bu.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('bu.' + k, JSON.stringify(v)); } catch {} },
  };
  const DEFAULTS = { repo: 'wooseokkoh/do-better-workspace', branch: 'main', dir: '00-inbox/raw' };
  let cfg = { ...DEFAULTS, ...store.get('cfg', {}) };
  let token = store.get('token', '');
  let items = [];
  let busy = false;

  const fmt = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ghUrl = (path) => `https://github.com/${cfg.repo}/tree/${encodeURIComponent(cfg.branch)}/${path.split('/').map(encodeURIComponent).join('/')}`;

  function say(id, kind, html) {
    const el = $(id);
    el.className = 'msg ' + kind;
    el.innerHTML = html;
    el.hidden = false;
  }

  function explain(e) {
    if (!e || e.status === undefined) return '인터넷 연결을 확인하고 다시 시도해 주세요.';
    if (e.status === 401) return '토큰이 틀렸거나 만료됐어요. 설정(⚙)에서 새 토큰을 넣어 주세요.';
    if (e.status === 403 || e.status === 404) return '이 저장소에 파일을 올릴 권한이 없어요. 토큰의 저장소 선택(do-better-workspace)과 Contents(Read and write) 권한을 확인해 주세요.';
    if (e.status === 413 || e.status === 422) return `파일이 너무 크거나 올릴 수 없는 파일이에요. (${esc(e.message)})`;
    return `오류가 났어요 (${e.status}): ${esc(e.message)}`;
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.slice(r.result.indexOf(',') + 1));
      r.onerror = () => reject(r.error);
      r.readAsDataURL(file);
    });
  }

  // ---- 설정 ----
  function openSettings(open) {
    $('settings').hidden = !open;
    $('uploader').hidden = open;
    if (open) {
      $('repo').value = cfg.repo;
      $('branch').value = cfg.branch;
      $('dir').value = cfg.dir;
      $('token').value = '';
      $('tokenState').textContent = token ? '토큰이 저장돼 있어요. 바꿀 때만 새로 입력하세요.' : '';
      $('settingsMsg').hidden = true;
    }
  }

  const owner = () => cfg.repo.split('/')[0];
  $('newTokenLink').href = `https://github.com/settings/personal-access-tokens/new?name=blog-uploader&description=${encodeURIComponent('모바일 사진 업로드')}&target_name=${encodeURIComponent(owner())}&contents=write`;

  $('openSettings').onclick = () => { if (!busy) openSettings($('settings').hidden); };

  $('saveSettings').onclick = async () => {
    const newToken = $('token').value.trim() || token;
    const next = {
      repo: $('repo').value.trim() || DEFAULTS.repo,
      branch: $('branch').value.trim() || DEFAULTS.branch,
      dir: ($('dir').value.trim() || DEFAULTS.dir).replace(/^\/+|\/+$/g, ''),
    };
    if (!newToken) return say('settingsMsg', 'err', '토큰을 입력해 주세요.');
    if (!/^[^/\s]+\/[^/\s]+$/.test(next.repo)) return say('settingsMsg', 'err', '저장소는 "아이디/저장소이름" 형식으로 적어 주세요.');
    say('settingsMsg', '', '연결 확인 중…');
    try {
      const [o, r] = next.repo.split('/');
      await checkAccess({ token: newToken, owner: o, repo: r });
      token = newToken;
      cfg = next;
      store.set('token', token);
      store.set('cfg', cfg);
      openSettings(false);
      renderFolder();
    } catch (e) {
      say('settingsMsg', 'err', explain(e));
    }
  };

  $('clearToken').onclick = () => {
    token = '';
    store.set('token', '');
    $('tokenState').textContent = '';
    say('settingsMsg', 'ok', '이 폰에서 토큰을 지웠어요.');
  };

  // ---- 선택한 파일 ----
  function addFiles(list) {
    for (const file of list) items.push({ file, url: URL.createObjectURL(file), li: null });
    renderGrid();
  }

  function renderGrid() {
    const grid = $('grid');
    grid.innerHTML = '';
    items.forEach((it, i) => {
      const li = document.createElement('li');
      if (it.file.size > MAX_BYTES) li.classList.add('big');
      const isVideo = it.file.type.startsWith('video/');
      const media = document.createElement(isVideo ? 'video' : 'img');
      if (isVideo) { media.muted = true; media.playsInline = true; media.preload = 'metadata'; media.src = it.url + '#t=0.1'; }
      else { media.alt = ''; media.src = it.url; }
      li.append(media);
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = (isVideo ? '🎬 ' : '') + fmt(it.file.size);
      li.append(tag);
      if (!busy) {
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'rm';
        rm.textContent = '×';
        rm.setAttribute('aria-label', '빼기');
        rm.onclick = () => { URL.revokeObjectURL(it.url); items.splice(i, 1); renderGrid(); };
        li.append(rm);
      }
      it.li = li;
      grid.append(li);
    });
    const total = items.reduce((s, it) => s + it.file.size, 0);
    const big = items.filter((it) => it.file.size > MAX_BYTES).length;
    $('summary').textContent = items.length
      ? `${items.length}개 선택 · 총 ${fmt(total)}` + (big ? ` · 100MB 넘는 파일 ${big}개는 올릴 수 없어요 (빨간 테두리, × 로 빼 주세요)` : '')
      : '';
    const noted = hasNote();
    $('uploadBtn').disabled = busy || (!items.length && !noted) || big > 0;
    $('uploadBtn').textContent = items.length
      ? `${items.length}개${noted ? ' + 가이드·메모' : ''} 올리기`
      : noted ? '가이드·메모만 올리기' : '올리기';
  }

  // ---- 가이드·메모 (info.md) ----
  const NOTE_IDS = ['guideUrl', 'guideText', 'memo'];
  const hasNote = () => NOTE_IDS.some((id) => $(id).value.trim());
  const pad = (n) => String(n).padStart(2, '0');

  function buildNote(posting, count) {
    const url = $('guideUrl').value.trim();
    const guide = $('guideText').value.trim();
    const memo = $('memo').value.trim();
    if (!url && !guide && !memo) return '';
    const d = new Date();
    let md = `# ${posting}\n\n- 올린 시각: ${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}\n- 함께 올린 파일: ${count}개\n`;
    if (url) md += `- 가이드 URL: ${url}\n`;
    if (guide) md += `\n## 가이드 내용\n\n${guide}\n`;
    if (memo) md += `\n## 체험 메모\n\n${memo}\n`;
    return md;
  }

  // 쓰다 만 내용은 폰에 임시 저장 (앱을 닫았다 열어도 유지)
  function saveDraft() {
    store.set('draft', Object.fromEntries(['posting', ...NOTE_IDS].map((id) => [id, $(id).value])));
  }
  function loadDraft() {
    const draft = store.get('draft', {});
    for (const id of ['posting', ...NOTE_IDS]) if (draft[id]) $(id).value = draft[id];
  }

  function renderFolder() {
    const name = cleanSegment($('posting').value) || '포스팅이름';
    $('folderPreview').textContent = folderFor(cfg.dir, name, new Date()) + '/';
  }

  function renderHistory() {
    const hist = store.get('history', []);
    $('history').innerHTML = hist.length
      ? hist.map((h) => {
          const d = new Date(h.at);
          return `<li><a href="${ghUrl(h.folder)}" target="_blank" rel="noopener">${esc(h.posting)}</a>` +
            `<span class="meta">${d.getMonth() + 1}/${d.getDate()} · ${h.count}개</span></li>`;
        }).join('')
      : '<li class="meta">아직 없어요</li>';
    $('recentNames').innerHTML = store.get('names', []).map((n) => `<option value="${esc(n)}">`).join('');
  }

  // ---- 올리기 ----
  async function upload() {
    const posting = cleanSegment($('posting').value);
    if (!posting) { say('result', 'err', '포스팅 이름을 적어 주세요.'); $('posting').focus(); return; }
    if (!token) { openSettings(true); return; }

    const total = items.length;
    const note = buildNote(posting, total);

    busy = true;
    renderGrid();
    for (const id of ['picker', 'posting', ...NOTE_IDS]) $(id).disabled = true;
    $('result').hidden = true;
    $('progress').hidden = false;

    let done = 0;
    const setBar = (text) => { $('bar').style.width = `${Math.round((done / Math.max(total, 1)) * 100)}%`; $('progressText').textContent = text; };
    setBar(`0 / ${total} 준비 중… 올리는 동안 이 화면을 켜 두세요.`);

    let lock = null;
    try { lock = await navigator.wakeLock?.request('screen'); } catch {}

    const folder = folderFor(cfg.dir, posting, new Date());
    const [o, r] = cfg.repo.split('/');
    try {
      await uploadFiles({
        token, owner: o, repo: r, branch: cfg.branch, folder,
        files: items.map((it) => ({ name: it.file.name, getBase64: () => fileToBase64(it.file) })),
        note,
        message: `모바일 업로드: ${posting} (${total}개${note ? ' + 가이드·메모' : ''})`,
        onProgress: (p) => {
          if (p.state === 'committing') return setBar('마무리 저장 중…');
          items[p.index].li.className = p.state === 'done' ? 'done' : 'up';
          if (p.state === 'done') done++;
          setBar(`${done} / ${total} 올리는 중… 올리는 동안 이 화면을 켜 두세요.`);
        },
      });

      const hist = store.get('history', []);
      hist.unshift({ posting, count: total, at: Date.now(), folder });
      store.set('history', hist.slice(0, 10));
      store.set('names', [posting, ...store.get('names', []).filter((n) => n !== posting)].slice(0, 20));

      items.forEach((it) => URL.revokeObjectURL(it.url));
      items = [];
      for (const id of NOTE_IDS) $(id).value = '';
      saveDraft();
      const what = [total ? `${total}개` : '', note ? '가이드·메모' : ''].filter(Boolean).join(' + ');
      say('result', 'ok',
        `완료! <b>${esc(posting)}</b> ${what}를 저장했어요. <a href="${ghUrl(folder)}" target="_blank" rel="noopener">GitHub에서 보기</a>` +
        `<br>PC에서 "${esc(posting)} 블로그 써줘"라고 말하면 가이드와 사진을 보고 원고를 써 드려요.`);
    } catch (e) {
      say('result', 'err', explain(e) + '<br>다시 누르면 처음부터 다시 올려요.');
    } finally {
      try { await lock?.release(); } catch {}
      busy = false;
      for (const id of ['picker', 'posting', ...NOTE_IDS]) $(id).disabled = false;
      $('progress').hidden = true;
      renderGrid();
      renderHistory();
    }
  }

  // ---- 갤러리 "공유"로 들어온 파일 (sw.js가 캐시에 넣어 둠) ----
  async function loadShared() {
    if (!new URLSearchParams(location.search).has('shared') || !('caches' in window)) return;
    try {
      const cache = await caches.open('share-inbox');
      const keys = await cache.keys();
      keys.sort((a, b) => Number(a.url.split('/').pop()) - Number(b.url.split('/').pop()));
      const list = [];
      for (const req of keys) {
        const res = await cache.match(req);
        const blob = await res.blob();
        list.push(new File([blob], decodeURIComponent(res.headers.get('X-File-Name') || 'file'), { type: blob.type }));
        await cache.delete(req);
      }
      addFiles(list);
    } catch {}
    history.replaceState(null, '', location.pathname);
  }

  $('picker').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
  $('posting').oninput = () => { renderFolder(); saveDraft(); };
  for (const id of NOTE_IDS) $(id).oninput = () => { saveDraft(); renderGrid(); };
  $('uploadBtn').onclick = upload;
  addEventListener('beforeunload', (e) => { if (busy) { e.preventDefault(); e.returnValue = ''; } });

  loadDraft();
  openSettings(!token);
  renderFolder();
  renderGrid();
  renderHistory();
  loadShared();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
